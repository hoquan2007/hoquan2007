name: Validate Profile

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "scripts/**"
      - "config/**"
      - "docs/**"
      - ".github/workflows/**"
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run QUAN.OS profile validator
        run: python scripts/validate_profile.py