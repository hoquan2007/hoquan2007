name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # Dark, cyan/violet palette aligned with QUAN.OS
          GITHUB_PROFILE_3D_PALETTE: "github-dark"
          GITHUB_PROFILE_3D_BLOCK_SIZE: "10"
          GITHUB_PROFILE_3D_BLOCK_GAP: "2"
          GITHUB_PROFILE_3D_CAMERA_POSITION: "0,-30,40"
          GITHUB_PROFILE_3D_CAMERA_TARGET: "0,-15,0"

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f profile-3d-contrib/ || true

          if git diff --cached --quiet; then
            echo "No 3D changes"
            exit 0
          fi

          git commit -m "chore(3d): refresh contribution skyline"
          git push
