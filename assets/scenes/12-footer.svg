<?xml version="1.0" encoding="UTF-8"?>
<!--
  12-footer.svg   System shutdown / session complete.
  Aurora fade, particles, slow wave, thanks for visiting.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="System shutdown — session complete" font-family="JetBrains Mono, ui-monospace, monospace">
  <title>QUAN.OS // Shutdown</title>
  <desc>Closing scene: thanks for visiting, neural core powering down.</desc>
  <defs>
    <radialGradient id="f-bg" cx="50%" cy="80%" r="60%">
      <stop offset="0" stop-color="#080B16"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="f-horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="f-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <style><![CDATA[
    .mono{font-family:JetBrains Mono,Fira Code,IBM Plex Mono,ui-monospace,Menlo,monospace}
    .sans{font-family:Inter,system-ui,-apple-system,sans-serif}
    .title{font-size:28px;fill:url(#f-text);letter-spacing:6px;font-weight:700}
    .sub{font-size:11px;fill:#22D3EE;letter-spacing:4px}
    .micro{font-size:9px;fill:#64748B;letter-spacing:2px}
    @media (prefers-reduced-motion: reduce){
      animate,animateTransform{display:none}
    }
  ]]></style>
  <rect width="1200" height="320" fill="url(#f-bg)"/>

  <!-- particles (few, calm) -->
  <g fill="#F8FAFC">
    <circle cx="120" cy="80" r="1"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="60" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="4.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="100" r="1"><animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="80" r="1.3"><animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="60" r="1"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="100" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="4.4s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- horizon glow -->
  <ellipse cx="600" cy="320" rx="900" ry="120" fill="url(#f-horizon)"/>

  <!-- waves -->
  <path d="M0 240 Q150 220 300 240 T600 240 T900 240 T1200 240" stroke="url(#f-wave)" stroke-width="1.5" fill="none">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0 240 Q150 220 300 240 T600 240 T900 240 T1200 240;
              M0 240 Q150 260 300 240 T600 240 T900 240 T1200 240;
              M0 240 Q150 220 300 240 T600 240 T900 240 T1200 240"/>
  </path>
  <path d="M0 270 Q150 250 300 270 T600 270 T900 270 T1200 270" stroke="url(#f-wave)" stroke-width="0.8" fill="none" opacity="0.55">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 270 Q150 250 300 270 T600 270 T900 270 T1200 270;
              M0 270 Q150 290 300 270 T600 270 T900 270 T1200 270;
              M0 270 Q150 250 300 270 T600 270 T900 270 T1200 270"/>
  </path>

  <!-- titles -->
  <g class="sans" text-anchor="middle">
    <text x="600" y="118" class="sub">▸ SESSION 01 · COMPLETE ·</text>
    <text x="600" y="170" class="title">THANKS FOR VISITING</text>
  </g>

  <!-- blinking caret prompt -->
  <g class="mono" transform="translate(600 210)" text-anchor="middle">
    <text class="micro">quan@neural-core:~$</text>
    <text class="micro" x="120" fill="#F8FAFC">echo "see you in the next build"</text>
    <rect x="284" y="-9" width="7" height="12" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="0" y1="290" x2="1200" y2="290" stroke="#1E293B" stroke-width="0.5"/>
  <g class="mono">
    <text class="micro" x="40" y="306">▸ POWERING DOWN NEURAL CORE ·</text>
    <text class="micro" x="1160" y="306" text-anchor="end" fill="#22D3EE">QUAN.OS · ONLINE · 2026</text>
  </g>
</svg>