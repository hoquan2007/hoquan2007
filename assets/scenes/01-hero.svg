<?xml version="1.0" encoding="UTF-8"?>
<!--
  01-hero.svg   QUAN.OS boot sequence hero.
  Cinematic deep-space boot. Target render area ~1200x560.
  Animation: aurora drift, grid scroll, particles, scan line, telemetry labels, terminal boot lines.
  Honors prefers-reduced-motion (animations disabled).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="QUAN.OS boot sequence   H&#x1ED3; Ng&#x1ECD;c Qu&#xE2;n engineering command center" font-family="JetBrains Mono, Fira Code, IBM Plex Mono, ui-monospace, Menlo, monospace">
  <title>QUAN.OS // Boot Sequence   H&#x1ED3; Ng&#x1ECD;c Qu&#xE2;n</title>
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="55%" r="80%">
      <stop offset="0" stop-color="#0B1530"/>
      <stop offset="0.45" stop-color="#070C1C"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="0.6"/>
    </pattern>
    <pattern id="grid-fine" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#0F172A" stroke-width="0.4"/>
    </pattern>

    <!-- Reusable star symbol -->
    <symbol id="star" viewBox="-1 -1 2 2">
      <circle r="1" fill="#F8FAFC"/>
    </symbol>
  </defs>

  <style><![CDATA[
    .mono{font-family:JetBrains Mono,Fira Code,IBM Plex Mono,ui-monospace,Menlo,monospace}
    .sans{font-family:Inter,Segoe UI,system-ui,-apple-system,sans-serif}
    .lbl{font-size:10px;fill:#94A3B8;letter-spacing:2px}
    .lbl-strong{font-size:11px;fill:#22D3EE;letter-spacing:2.4px}
    .line{font-size:13.5px;fill:#94A3B8;letter-spacing:1px}
    .line-ok{font-size:13.5px;fill:#22D3EE;letter-spacing:1px}
    .prompt{font-size:14px;fill:#7C3AED;letter-spacing:1px}
    .name{font-size:62px;font-weight:700;letter-spacing:8px;fill:url(#text-grad);font-family:Inter,system-ui,sans-serif}
    .sub{font-size:14px;fill:#94A3B8;letter-spacing:6px}
    .badge{font-size:10px;fill:#22D3EE;letter-spacing:3px}
    .caret{fill:#22D3EE}
    .corner{fill:none;stroke:#22D3EE;stroke-width:1.2;opacity:0.7}
    .micro{font-size:9px;fill:#64748B;letter-spacing:2px}
    @media (prefers-reduced-motion: reduce){
      animate,animateTransform,animateMotion{display:none}
    }
  ]]></style>

  <!-- Layer 0: base -->
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid-fine)" opacity="0.55"/>
  <rect width="1200" height="560" fill="url(#grid)" opacity="0.7"/>

  <!-- Layer 1: aurora (animated translate) -->
  <g opacity="0.85">
    <ellipse cx="600" cy="180" rx="900" ry="140" fill="url(#aurora1)" filter="url(#blur6)">
      <animate attributeName="cx" values="200;1000;200" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="500" cy="320" rx="800" ry="110" fill="url(#aurora2)" filter="url(#blur6)">
      <animate attributeName="cx" values="1000;200;1000" dur="18s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Layer 2: stars -->
  <g>
    <use href="#star" x="80" y="60" width="2" height="2"/>
    <use href="#star" x="160" y="110" width="1.5" height="1.5"/>
    <use href="#star" x="240" y="40" width="2.2" height="2.2"/>
    <use href="#star" x="340" y="90" width="1.6" height="1.6"/>
    <use href="#star" x="430" y="50" width="1.4" height="1.4"/>
    <use href="#star" x="520" y="80" width="2" height="2"/>
    <use href="#star" x="640" y="30" width="1.5" height="1.5"/>
    <use href="#star" x="740" y="60" width="2.4" height="2.4">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
    </use>
    <use href="#star" x="830" y="100" width="1.4" height="1.4"/>
    <use href="#star" x="920" y="40" width="1.8" height="1.8"/>
    <use href="#star" x="1020" y="90" width="2" height="2"/>
    <use href="#star" x="1100" y="60" width="1.6" height="1.6"/>
    <use href="#star" x="1160" y="120" width="1.5" height="1.5"/>
    <use href="#star" x="60" y="160" width="1.4" height="1.4"/>
    <use href="#star" x="1140" y="200" width="1.8" height="1.8"/>
    <use href="#star" x="40" y="240" width="1.2" height="1.2"/>
    <use href="#star" x="1170" y="280" width="1.4" height="1.4"/>
    <use href="#star" x="20" y="320" width="1.5" height="1.5"/>
    <use href="#star" x="1180" y="360" width="1.2" height="1.2"/>
    <use href="#star" x="50" y="400" width="1.3" height="1.3"/>
    <use href="#star" x="1160" y="440" width="1.4" height="1.4"/>
    <use href="#star" x="80" y="500" width="1.2" height="1.2"/>
    <use href="#star" x="1130" y="500" width="1.3" height="1.3"/>
  </g>

  <!-- Layer 3: moving particles (3 light streaks traveling diagonally) -->
  <g opacity="0.85">
    <g>
      <circle r="2.5" fill="#22D3EE"/>
      <circle r="8" fill="#22D3EE" opacity="0.18">
        <animate attributeName="opacity" values="0;0.25;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M-40 -20 L1240 580"/>
    </g>
    <g>
      <circle r="2" fill="#A855F7"/>
      <animateMotion dur="11s" repeatCount="indefinite" path="M1240 -20 L-40 580"/>
    </g>
    <g>
      <circle r="1.6" fill="#F8FAFC"/>
      <animateMotion dur="13s" repeatCount="indefinite" path="M-20 320 L1220 320"/>
    </g>
    <g>
      <circle r="1.4" fill="#22D3EE"/>
      <animateMotion dur="15s" repeatCount="indefinite" path="M600 -20 L600 580"/>
    </g>
  </g>

  <!-- Layer 4: scanning line -->
  <g>
    <rect x="0" y="0" width="1200" height="2" fill="#22D3EE" opacity="0.55">
      <animate attributeName="y" values="0;560;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.0;0.55;0.0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Layer 5: corner brackets -->
  <g class="mono">
    <path class="corner" d="M24 24 H70 M24 24 V70"/>
    <path class="corner" d="M1176 24 H1130 M1176 24 V70"/>
    <path class="corner" d="M24 536 H70 M24 536 V490"/>
    <path class="corner" d="M1176 536 H1130 M1176 536 V490"/>
  </g>

  <!-- Layer 6: top edge telemetry labels -->
  <g class="mono">
    <text class="micro" x="86" y="38">SYS://HOQUAN2007</text>
    <text class="micro" x="86" y="54" fill="#22D3EE">? UPLINK ACTIVE</text>
    <text class="micro" x="1114" y="38" text-anchor="end">NODE 01 ? BUILD 2026</text>
    <text class="micro" x="1114" y="54" text-anchor="end" fill="#A855F7">LATENCY &lt;01ms</text>
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#1E293B" stroke-width="0.6"/>
  </g>

  <!-- Layer 7: center identity -->
  <g>
    <!-- radial glow behind name -->
    <circle cx="600" cy="220" r="280" fill="url(#glow)" filter="url(#blur6)" opacity="0.9"/>

    <!-- tag above -->
    <g transform="translate(600 130)">
      <rect x="-110" y="-16" width="220" height="32" rx="16" fill="none" stroke="#22D3EE" stroke-opacity="0.55"/>
      <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#020617" fill-opacity="0.55"/>
      <circle cx="-86" cy="0" r="3.5" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="-72" y="4" class="badge">ENGINEERING COMMAND CENTER</text>
    </g>

    <text x="600" y="232" text-anchor="middle" class="sans name">H? NG?C QU?N</text>
    <text x="600" y="268" text-anchor="middle" class="mono sub">SOFTWARE ? SYSTEMS ? INTELLIGENCE</text>

    <!-- caret under name -->
    <g transform="translate(600 300)">
      <line x1="-180" y1="0" x2="-22" y2="0" stroke="#22D3EE" stroke-width="1" opacity="0.6"/>
      <line x1="22" y1="0" x2="180" y2="0" stroke="#A855F7" stroke-width="1" opacity="0.6"/>
      <text x="0" y="4" text-anchor="middle" class="mono micro" fill="#22D3EE">QUAN.OS</text>
    </g>
  </g>

  <!-- Layer 8: terminal boot panel -->
  <g transform="translate(280 340)">
    <rect x="0" y="0" width="640" height="160" rx="8" fill="#020617" fill-opacity="0.85" stroke="#22D3EE" stroke-opacity="0.45"/>
    <line x1="0" y1="26" x2="640" y2="26" stroke="#22D3EE" stroke-opacity="0.3"/>
    <circle cx="14" cy="13" r="4" fill="#7C3AED"/>
    <circle cx="28" cy="13" r="4" fill="#A855F7"/>
    <circle cx="42" cy="13" r="4" fill="#22D3EE"/>
    <text x="60" y="17" class="mono micro" fill="#94A3B8">quan-os ? /dev/stdout</text>

    <!-- boot lines with typewriter reveal -->
    <g class="mono" font-size="13">
      <text x="16" y="50" class="prompt">$</text>
      <text x="32" y="50" class="line">INITIALIZING QUAN.OS</text>
      <text x="240" y="50" class="line-ok" opacity="0">OK
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>
      </text>

      <text x="16" y="72" class="prompt">$</text>
      <text x="32" y="72" class="line">LOADING ENGINEERING MODULES ............</text>
      <text x="478" y="72" class="line-ok" opacity="0">DONE
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/>
      </text>

      <text x="16" y="94" class="prompt">$</text>
      <text x="32" y="94" class="line">CONNECTING TO GITHUB ..................</text>
      <text x="478" y="94" class="line-ok" opacity="0">LINK
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
      </text>

      <text x="16" y="116" class="prompt">$</text>
      <text x="32" y="116" class="line">AI SYSTEMS ......... ONLINE</text>
      <text x="16" y="138" class="prompt">$</text>
      <text x="32" y="138" class="line">BACKEND ............ ONLINE</text>
      
      <!-- blinking caret at end -->
      <rect x="270" y="125" width="9" height="16" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="1s" begin="2.0s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Layer 9: side telemetry strips -->
  <g class="mono" font-size="10">
    <g transform="translate(40 200)">
      <text class="lbl-strong">SYS</text>
      <text class="lbl" y="14">v1.0.0</text>
      <text class="lbl" y="28">CORE OK</text>
      <rect x="0" y="36" width="80" height="3" fill="#0F172A"/>
      <rect x="0" y="36" width="62" height="3" fill="#22D3EE">
        <animate attributeName="width" values="35;78;35" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(40 320)">
      <text class="lbl-strong">NET</text>
      <text class="lbl" y="14">PKT 0.6ms</text>
      <text class="lbl" y="28">RELIABLE</text>
      <rect x="0" y="36" width="80" height="3" fill="#0F172A"/>
      <rect x="0" y="36" width="48" height="3" fill="#A855F7">
        <animate attributeName="width" values="20;72;20" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(1080 200)" text-anchor="end">
      <text class="lbl-strong">GPU</text>
      <text class="lbl" y="14">RTX ? READY</text>
      <text class="lbl" y="28">DRIVER OK</text>
      <rect x="0" y="36" width="80" height="3" fill="#0F172A"/>
      <rect x="0" y="36" width="55" height="3" fill="#22D3EE">
        <animate attributeName="width" values="30;75;30" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(1080 320)" text-anchor="end">
      <text class="lbl-strong">AI</text>
      <text class="lbl" y="14">MODEL ? STANDBY</text>
      <text class="lbl" y="28">TOKEN d 8K</text>
      <rect x="0" y="36" width="80" height="3" fill="#0F172A"/>
      <rect x="0" y="36" width="35" height="3" fill="#A855F7">
        <animate attributeName="width" values="20;62;20" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Layer 10: horizon glow + wave -->
  <g>
    <ellipse cx="600" cy="560" rx="900" ry="80" fill="url(#horizon)" opacity="0.7"/>
    <path d="M0 525 Q150 510 300 525 T600 525 T900 525 T1200 525 L1200 560 L0 560 Z" fill="#22D3EE" fill-opacity="0.05">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M0 525 Q150 510 300 525 T600 525 T900 525 T1200 525 L1200 560 L0 560 Z;
                M0 525 Q150 540 300 525 T600 525 T900 525 T1200 525 L1200 560 L0 560 Z;
                M0 525 Q150 510 300 525 T600 525 T900 525 T1200 525 L1200 560 L0 560 Z"/>
    </path>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- Layer 11: footer micro labels -->
  <g class="mono">
    <text class="micro" x="600" y="548" text-anchor="middle">? TRANSMISSION CHANNEL OPEN ?</text>
  </g>
</svg>
