<?xml version="1.0" encoding="UTF-8"?>
<!--
  10-activity-stream.svg   Static activity timeline placeholder.
  Real version is generated by scripts/generate_profile_metrics.py on every CI run.
  This static file is the visible fallback when CI has not yet run.
  Shows last 6 push events from public repos (snapshot 2026-09-15).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Recent public activity timeline" font-family="JetBrains Mono, ui-monospace, monospace">
  <title>QUAN.OS // Activity Stream</title>
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080B16"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="a-track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <pattern id="a-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#10172A" stroke-width="0.5"/>
    </pattern>
  </defs>
  <style><![CDATA[
    .mono{font-family:JetBrains Mono,Fira Code,IBM Plex Mono,ui-monospace,Menlo,monospace}
    .lbl{font-size:12px;fill:#F8FAFC;letter-spacing:2px;font-weight:700}
    .time{font-size:10px;fill:#22D3EE;letter-spacing:2px}
    .desc{font-size:10px;fill:#94A3B8;letter-spacing:1.5px}
    .micro{font-size:9px;fill:#64748B;letter-spacing:2px}
    .legend{font-size:10px;fill:#94A3B8;letter-spacing:2px}
    @media (prefers-reduced-motion: reduce){
      animate,animateTransform{display:none}
    }
  ]]></style>

  <rect width="1200" height="540" fill="url(#a-bg)"/>
  <rect width="1200" height="540" fill="url(#a-grid)" opacity="0.45"/>

  <g class="mono">
    <text class="micro" x="40" y="34">SCENE 10 / ACTIVITY STREAM</text>
    <line x1="40" y1="42" x2="340" y2="42" stroke="#22D3EE" stroke-opacity="0.6"/>
    <text class="micro" x="1160" y="34" text-anchor="end">PUBLIC PUSHES ? LAST UPDATED 2026-09-15</text>
  </g>

  <!-- signal monitor background -->
  <g>
    <line x1="60" y1="100" x2="60" y2="460" stroke="url(#a-track)" stroke-width="1"/>
    <line x1="60" y1="460" x2="1140" y2="460" stroke="#1E293B"/>
    <!-- tick lines -->
    <g stroke="#1E293B">
      <line x1="56" y1="140" x2="1140" y2="140"/>
      <line x1="56" y1="200" x2="1140" y2="200"/>
      <line x1="56" y1="260" x2="1140" y2="260"/>
      <line x1="56" y1="320" x2="1140" y2="320"/>
      <line x1="56" y1="380" x2="1140" y2="380"/>
    </g>
  </g>

  <!-- timeline events (verified snapshot, descending by updated_at) -->
  <g class="mono">
    <!-- event 1 -->
    <g transform="translate(120 200)">
      <circle r="6" fill="#22D3EE"/>
      <circle r="6" fill="none" stroke="#22D3EE" stroke-opacity="0.6">
        <animate attributeName="r" values="6;14;6" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="14" y="-4" class="time">2026-09 ? most recent</text>
      <text x="14" y="14" class="lbl">face-attendance</text>
      <text x="14" y="30" class="desc">TypeScript ? updated</text>
      <text x="14" y="46" class="micro">github.com/hoquan2007/face-attendance</text>
    </g>
    <!-- event 2 -->
    <g transform="translate(280 260)">
      <circle r="6" fill="#A855F7"/>
      <circle r="6" fill="none" stroke="#A855F7" stroke-opacity="0.6">
        <animate attributeName="r" values="6;14;6" dur="2.6s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2.6s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <text x="14" y="-4" class="time">2026 ? Q3</text>
      <text x="14" y="14" class="lbl">QITEnglish</text>
      <text x="14" y="30" class="desc">TypeScript ? web learning suite</text>
      <text x="14" y="46" class="micro">github.com/hoquan2007/QITEnglish</text>
    </g>
    <!-- event 3 -->
    <g transform="translate(440 200)">
      <circle r="6" fill="#7C3AED"/>
      <circle r="6" fill="none" stroke="#7C3AED" stroke-opacity="0.6">
        <animate attributeName="r" values="6;14;6" dur="2.8s" repeatCount="indefinite" begin="0.6s"/>
        <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2.8s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <text x="14" y="-4" class="time">2026 ? Q3</text>
      <text x="14" y="14" class="lbl">QMusic</text>
      <text x="14" y="30" class="desc">Personal web music player</text>
      <text x="14" y="46" class="micro">github.com/hoquan2007/QMusic</text>
    </g>
    <!-- event 4 -->
    <g transform="translate(600 320)">
      <circle r="6" fill="#22D3EE"/>
      <circle r="6" fill="none" stroke="#22D3EE" stroke-opacity="0.6">
        <animate attributeName="r" values="6;14;6" dur="3.0s" repeatCount="indefinite" begin="0.9s"/>
        <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="3.0s" repeatCount="indefinite" begin="0.9s"/>
      </circle>
      <text x="14" y="-4" class="time">2026 ? Q3</text>
      <text x="14" y="14" class="lbl">QEnglish</text>
      <text x="14" y="30" class="desc">AI-powered English learning</text>
      <text x="14" y="46" class="micro">github.com/hoquan2007/QEnglish</text>
    </g>
    <!-- event 5 -->
    <g transform="translate(760 260)">
      <circle r="6" fill="#A855F7"/>
      <circle r="6" fill="none" stroke="#A855F7" stroke-opacity="0.6">
        <animate attributeName="r" values="6;14;6" dur="3.2s" repeatCount="indefinite" begin="1.2s"/>
        <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="3.2s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
      <text x="14" y="-4" class="time">2026 ? Q3</text>
      <text x="14" y="14" class="lbl">Web-xem-phim</text>
      <text x="14" y="30" class="desc">Movie streaming web app</text>
      <text x="14" y="46" class="micro">github.com/hoquan2007/Web-xem-phim</text>
    </g>
    <!-- event 6 -->
    <g transform="translate(920 380)">
      <circle r="6" fill="#7C3AED"/>
      <circle r="6" fill="none" stroke="#7C3AED" stroke-opacity="0.6">
        <animate attributeName="r" values="6;14;6" dur="3.4s" repeatCount="indefinite" begin="1.5s"/>
        <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="3.4s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
      <text x="14" y="-4" class="time">2025 ? Q4</text>
      <text x="14" y="14" class="lbl">GPU-Server-Manager</text>
      <text x="14" y="30" class="desc">C ? GPU resource scheduler</text>
      <text x="14" y="46" class="micro">github.com/hoquan2007/GPU-Server-Manager</text>
    </g>
  </g>

  <!-- traveling sweep -->
  <g>
    <rect x="60" y="100" width="2" height="360" fill="#22D3EE" opacity="0.4">
      <animate attributeName="x" values="60;1140;60" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- footer -->
  <g class="mono">
    <line x1="40" y1="478" x2="1160" y2="478" stroke="#1E293B"/>
    <text class="legend" x="40" y="500">? PUSH</text>
    <text class="legend" x="140" y="500">? RELEASE</text>
    <text class="legend" x="260" y="500">? CREATE</text>
    <text class="legend" x="380" y="500">? UPDATE</text>
    <text class="micro" x="1160" y="500" text-anchor="end" fill="#22D3EE">SIGNAL LIVE ? 0.4Hz</text>
    <text class="micro" x="40" y="520">SAMPLE ONLY ? CI GENERATES FULL TIMELINE FROM EVENTS API</text>
    <text class="micro" x="1160" y="520" text-anchor="end" fill="#A855F7">VERIFIED SOURCES</text>
  </g>
</svg>
