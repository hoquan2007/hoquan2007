<?xml version="1.0" encoding="UTF-8"?>
<!--
  15-philosophy.svg   Cinematic pause. 5 statement words.
  Large typography + slow background particles. Provides an eye-rest before footer.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Developer philosophy" font-family="JetBrains Mono, ui-monospace, monospace">
  <title>QUAN.OS // Philosophy</title>
  <defs>
    <radialGradient id="ph-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="ph-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="ph-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ph-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#10172A" stroke-width="0.5"/>
    </pattern>
  </defs>
  <style><![CDATA[
    .mono{font-family:JetBrains Mono,Fira Code,IBM Plex Mono,ui-monospace,Menlo,monospace}
    .sans{font-family:Inter,system-ui,-apple-system,sans-serif}
    .word{font-size:54px;fill:url(#ph-text);letter-spacing:14px;font-weight:700}
    .micro{font-size:9px;fill:#64748B;letter-spacing:2px}
    @media (prefers-reduced-motion: reduce){
      animate,animateTransform{display:none}
    }
  ]]></style>
  <rect width="1200" height="420" fill="url(#ph-bg)"/>
  <rect width="1200" height="420" fill="url(#ph-grid)" opacity="0.45"/>
  <g class="mono">
    <text class="micro" x="40" y="34">SCENE 15 / PHILOSOPHY</text>
    <line x1="40" y1="42" x2="320" y2="42" stroke="#22D3EE" stroke-opacity="0.6"/>
    <text class="micro" x="1160" y="34" text-anchor="end">A QUIET MOMENT</text>
  </g>

  <!-- particles -->
  <g fill="#F8FAFC">
    <circle cx="120" cy="120" r="1"><animate attributeName="opacity" values="0;1;0" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="80" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="4.0s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="320" r="1"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="60" r="1.3"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="340" r="1"><animate attributeName="opacity" values="0;1;0" dur="4.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="80" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="320" r="1"><animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="120" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- glow -->
  <ellipse cx="600" cy="210" rx="540" ry="80" fill="url(#ph-halo)"/>

  <!-- statement -->
  <g class="sans" text-anchor="middle">
    <text x="600" y="160" class="word">LEARN.</text>
    <text x="600" y="220" class="word">BUILD.</text>
    <text x="600" y="280" class="word">BREAK.</text>
    <text x="600" y="340" class="word">UNDERSTAND.</text>
  </g>

  <!-- IMROVE at bottom with slower scale -->
  <text x="600" y="380" text-anchor="middle" class="sans word" font-size="38">IMPROVE.</text>

  <g class="mono">
    <text class="micro" x="40" y="400">? PAUSE ? OBSERVE ? RESUME</text>
    <text class="micro" x="1160" y="400" text-anchor="end">QUAN-OS ? CORE TENETS</text>
  </g>
</svg>
