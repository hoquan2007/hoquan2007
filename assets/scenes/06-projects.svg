<?xml version="1.0" encoding="UTF-8"?>
<!--
  06-projects.svg   Holographic project cards. 4 verified projects.
  Each card shows: name, verified description, language, last update, key concept.
  Animations: border scanning, status LED, subtle floating.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Featured projects gallery" font-family="JetBrains Mono, ui-monospace, monospace">
