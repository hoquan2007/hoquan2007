    .desc{font-size:10px;fill:#94A3B8;letter-spacing:0.5px}
    .lang{font-size:9px;fill:#22D3EE;letter-spacing:2px}
    .lang-v{font-size:9px;fill:#A855F7;letter-spacing:2px}
    .meta{font-size:9px;fill:#64748B;letter-spacing:1.5px}
    .micro{font-size:9px;fill:#64748B;letter-spacing:2px}
    .lbl{font-size:11px;fill:#94A3B8;letter-spacing:3px}
    @media (prefers-reduced-motion: reduce){
      animate,animateTransform{display:none}
    }
  ]]></style>

