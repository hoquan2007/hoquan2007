<?xml version="1.0" encoding="UTF-8"?>
<!--
  02-identity.svg   Identity terminal card with animated typing of whoami fields.
  Dimensions 1200x440. Two-pane layout: terminal on left, micro system diagram on right.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Identity terminal: H&#x1ED3; Ng&#x1ECD;c Qu&#xE2;n, @hoquan2007" font-family="JetBrains Mono, Fira Code, IBM Plex Mono, ui-monospace, Menlo, monospace">
  <title>QUAN.OS // Identity</title>
  <defs>
    <linearGradient id="i-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080B16"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="i-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#070A18"/>
    </linearGradient>
    <linearGradient id="i-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="i-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="i-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#10172A" stroke-width="0.6"/>
    </pattern>
  </defs>
  <style><![CDATA[
    .mono{font-family:JetBrains Mono,Fira Code,IBM Plex Mono,ui-monospace,Menlo,monospace}
    .key{font-size:11px;fill:#7C3AED;letter-spacing:2px}
    .val{font-size:14px;fill:#F8FAFC;letter-spacing:1px}
    .val-cyan{font-size:14px;fill:#22D3EE;letter-spacing:1px}
    .cmd{font-size:16px;fill:#94A3B8;letter-spacing:2px}
    .prompt{font-size:15px;fill:#A855F7}
    .micro{font-size:9px;fill:#64748B;letter-spacing:2px}
    .lbl{font-size:10px;fill:#94A3B8;letter-spacing:3px}
    .corner{fill:none;stroke:#22D3EE;stroke-width:1.2;opacity:0.65}
    .corner-v{fill:none;stroke:#A855F7;stroke-width:1.2;opacity:0.65}
    @media (prefers-reduced-motion: reduce){
      animate,animateTransform{display:none}
    }
  ]]></style>

  <rect width="1200" height="440" fill="url(#i-bg)"/>
  <rect width="1200" height="440" fill="url(#i-grid)" opacity="0.6"/>

  <!-- section label -->
  <g class="mono">
    <text class="micro" x="40" y="34">SCENE 02 / IDENTITY · WHOAMI</text>
    <line x1="40" y1="42" x2="220" y2="42" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="1"/>
    <text class="micro" x="1160" y="34" text-anchor="end">SECURE LINK · TLS</text>
    <line x1="980" y1="42" x2="1160" y2="42" stroke="#A855F7" stroke-opacity="0.7" stroke-width="1"/>
  </g>

  <!-- LEFT: terminal card -->
  <g transform="translate(60 80)">
    <!-- card glow -->
    <rect x="-12" y="-12" width="664" height="324" rx="14" fill="url(#i-glow)"/>
    <!-- main card -->
    <rect x="0" y="0" width="640" height="300" rx="10" fill="url(#i-card)" stroke="url(#i-border)" stroke-width="1"/>
    <!-- inner border (animated) -->
    <rect x="6" y="6" width="628" height="288" rx="6" fill="none" stroke="#22D3EE" stroke-opacity="0.18"/>
    <!-- title bar -->
    <rect x="0" y="0" width="640" height="36" rx="10" fill="#0B1224"/>
    <rect x="0" y="30" width="640" height="6" fill="#0B1224"/>
    <line x1="0" y1="36" x2="640" y2="36" stroke="url(#i-border)" stroke-width="1"/>
    <circle cx="18" cy="18" r="5" fill="#7C3AED"/>
    <circle cx="36" cy="18" r="5" fill="#A855F7"/>
    <circle cx="54" cy="18" r="5" fill="#22D3EE"/>
    <text x="320" y="23" text-anchor="middle" class="mono" font-size="11" fill="#94A3B8">quan@neural-core: ~/identity</text>

    <!-- animated border corners -->
    <g>
      <path class="corner" d="M14 56 V46 H24"/>
      <path class="corner" d="M626 56 V46 H616"/>
      <path class="corner" d="M14 244 V254 H24"/>
      <path class="corner" d="M626 244 V254 H616"/>
      <circle cx="14" cy="46" r="2" fill="#22D3EE">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="626" cy="46" r="2" fill="#A855F7">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- typed prompt -->
    <g transform="translate(28 76)">
      <text class="mono prompt">quan@neural-core:~$</text>
      <!-- typewriter reveal of &quot;whoami json&quot; -->
      <text class="mono cmd" fill="#F8FAFC">
        <tspan>whoami --json</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.4s" fill="freeze"/>
      </text>
      <!-- caret blinking after command -->
      <rect x="160" y="-12" width="9" height="16" fill="#22D3EE" opacity="0">
        <animate attributeName="opacity" values="1;0;1" dur="1s" begin="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- JSON output -->
    <g transform="translate(28 116)" class="mono">
      <text x="0" y="0" class="key">{</text>

      <text x="20" y="22" class="key">"name":</text>
      <text x="100" y="22" class="val-cyan">"H&#x1ED3; Ng&#x1ECD;c Qu&#xE2;n"</text>

      <text x="20" y="44" class="key">"handle":</text>
      <text x="100" y="44" class="val-cyan">"@hoquan2007"</text>

      <text x="20" y="66" class="key">"role":</text>
      <text x="100" y="66" class="val">"Software Engineering Student"</text>

      <text x="20" y="88" class="key">"mode":</text>
      <text x="100" y="88" class="val">"LEARNING · BUILDING · EXPERIMENTING"</text>

      <text x="20" y="110" class="key">"founded":</text>
      <text x="120" y="110" class="val-cyan">"2025-07-30"</text>

      <text x="20" y="132" class="key">"languages":</text>
      <text x="120" y="132" class="val">["TypeScript","C","C++","HTML"]</text>

      <text x="20" y="154" class="key">"domains":</text>
      <text x="120" y="154" class="val">["AI","Backend","Systems","Algorithms"]</text>

      <text x="0" y="176" class="key">}</text>
    </g>

    <!-- bottom prompt -->
    <g transform="translate(28 280)">
      <text class="mono prompt">quan@neural-core:~$</text>
      <rect x="186" y="-12" width="9" height="16" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- RIGHT: micro system diagram -->
  <g transform="translate(760 100)">
    <text class="mono lbl" x="0" y="0">SYSTEM MAP</text>
    <text class="mono micro" x="0" y="14">5 ACTIVE NODES · 12 LINKS</text>

    <!-- nodes -->
    <g transform="translate(180 130)">
      <!-- center node: HO QUAN -->
      <circle r="44" fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-dasharray="3 4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle r="34" fill="#0B1224" stroke="#22D3EE" stroke-width="1.2"/>
      <text y="-2" text-anchor="middle" class="mono" font-size="11" fill="#F8FAFC" letter-spacing="1.5">HO QUAN</text>
      <text y="14" text-anchor="middle" class="mono" font-size="9" fill="#22D3EE" letter-spacing="2">CORE</text>
      <circle r="5" fill="#22D3EE">
        <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 5 satellite nodes -->
    <g class="mono" font-size="10">
      <!-- AI -->
      <g transform="translate(40 30)">
        <line x1="0" y1="0" x2="140" y2="100" stroke="#22D3EE" stroke-opacity="0.4">
          <animate attributeName="stroke-opacity" values="0.15;0.7;0.15" dur="3.6s" repeatCount="indefinite"/>
        </line>
        <circle r="14" fill="#0B1224" stroke="#7C3AED"/>
        <text y="3" text-anchor="middle" fill="#A855F7" letter-spacing="1.5">AI</text>
      </g>
      <!-- SOFTWARE -->
      <g transform="translate(320 30)">
        <line x1="0" y1="0" x2="-140" y2="100" stroke="#22D3EE" stroke-opacity="0.4">
          <animate attributeName="stroke-opacity" values="0.7;0.15;0.7" dur="3.6s" repeatCount="indefinite"/>
        </line>
        <circle r="14" fill="#0B1224" stroke="#22D3EE"/>
        <text y="3" text-anchor="middle" fill="#22D3EE" letter-spacing="1.5">SOFT</text>
      </g>
      <!-- SYSTEMS -->
      <g transform="translate(40 240)">
        <line x1="0" y1="0" x2="140" y2="-100" stroke="#A855F7" stroke-opacity="0.4">
          <animate attributeName="stroke-opacity" values="0.15;0.7;0.15" dur="4.2s" repeatCount="indefinite"/>
        </line>
        <circle r="14" fill="#0B1224" stroke="#A855F7"/>
        <text y="3" text-anchor="middle" fill="#A855F7" letter-spacing="1.5">SYS</text>
      </g>
      <!-- DATA -->
      <g transform="translate(320 240)">
        <line x1="0" y1="0" x2="-140" y2="-100" stroke="#A855F7" stroke-opacity="0.4">
          <animate attributeName="stroke-opacity" values="0.7;0.15;0.7" dur="4.2s" repeatCount="indefinite"/>
        </line>
        <circle r="14" fill="#0B1224" stroke="#22D3EE"/>
        <text y="3" text-anchor="middle" fill="#22D3EE" letter-spacing="1.5">DATA</text>
      </g>
      <!-- ALGO -->
      <g transform="translate(180 290)">
        <line x1="0" y1="0" x2="0" y2="-160" stroke="#22D3EE" stroke-opacity="0.4">
          <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="3.2s" repeatCount="indefinite"/>
        </line>
        <circle r="14" fill="#0B1224" stroke="#7C3AED"/>
        <text y="3" text-anchor="middle" fill="#A855F7" letter-spacing="1.5">ALGO</text>
      </g>
    </g>

    <!-- moving packet -->
    <g>
      <circle r="3" fill="#F8FAFC">
        <animateMotion dur="3.6s" repeatCount="indefinite" path="M40 30 L180 130"/>
      </circle>
      <circle r="2.5" fill="#22D3EE">
        <animateMotion dur="4.2s" repeatCount="indefinite" path="M320 30 L180 130"/>
      </circle>
      <circle r="2.5" fill="#A855F7">
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M180 290 L180 130"/>
      </circle>
    </g>

    <!-- frame -->
    <rect x="-12" y="-30" width="380" height="350" rx="6" fill="none" stroke="#1E293B" stroke-dasharray="2 6"/>
    <text class="mono micro" x="0" y="-12">fig.01   cognitive topology</text>
  </g>

  <!-- bottom -->
  <g class="mono">
    <text class="micro" x="40" y="414">authentication .......... verified</text>
    <text class="micro" x="600" y="414" text-anchor="middle">all modules reporting nominal</text>
    <text class="micro" x="1160" y="414" text-anchor="end">session · encrypted</text>
  </g>
</svg>
