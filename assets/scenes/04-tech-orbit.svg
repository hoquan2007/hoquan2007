<?xml version="1.0" encoding="UTF-8"?>
<!--
  04-tech-orbit.svg   Technology solar system.
  Center: ENGINEERING CORE. 5 orbital rings: Languages, Web, Backend, Data, Tools.
  Each ring holds 2-7 verified tech nodes that drift slowly around the center.
  All tech names are verified from the user's actual public repos.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Technology solar system: verified languages, web, backend, data, tools" font-family="JetBrains Mono, ui-monospace, monospace">
  <title>QUAN.OS // Tech Universe</title>
  <defs>
    <radialGradient id="o-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="o-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.6" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="o-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="o-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#10172A" stroke-width="0.5"/>
    </pattern>
    <filter id="o-blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <style><![CDATA[
    .mono{font-family:JetBrains Mono,Fira Code,IBM Plex Mono,ui-monospace,Menlo,monospace}
    .lbl{font-size:11px;fill:#94A3B8;letter-spacing:3px}
    .tech{font-size:11px;fill:#F8FAFC;letter-spacing:1.2px}
    .ring-lbl{font-size:9px;fill:#22D3EE;letter-spacing:3px}
    .ring-lbl-v{font-size:9px;fill:#A855F7;letter-spacing:3px}
    .micro{font-size:9px;fill:#64748B;letter-spacing:2px}
    @media (prefers-reduced-motion: reduce){
      animate,animateTransform{display:none}
    }
  ]]></style>

  <rect width="800" height="800" fill="url(#o-bg)"/>
  <rect width="800" height="800" fill="url(#o-grid)" opacity="0.45"/>

  <!-- ring labels (placed in upper-right of each ring) -->
  <g class="mono">
    <text class="ring-lbl" x="400" y="240" text-anchor="middle">LANGUAGES</text>
    <text class="ring-lbl-v" x="400" y="560" text-anchor="middle">WEB STACK</text>
    <text class="ring-lbl" x="690" y="400" text-anchor="middle">DATA</text>
    <text class="ring-lbl-v" x="110" y="400" text-anchor="middle">SYSTEMS</text>
    <text class="ring-lbl" x="540" y="140" text-anchor="end">TOOLS</text>
  </g>

  <!-- orbit rings (radii 90, 150, 210, 270, 330) -->
  <g fill="none">
    <circle cx="400" cy="400" r="90"  stroke="#22D3EE" stroke-opacity="0.3" stroke-dasharray="2 4"/>
    <circle cx="400" cy="400" r="150" stroke="#7C3AED" stroke-opacity="0.28" stroke-dasharray="2 4"/>
    <circle cx="400" cy="400" r="210" stroke="#22D3EE" stroke-opacity="0.25" stroke-dasharray="2 4"/>
    <circle cx="400" cy="400" r="270" stroke="#A855F7" stroke-opacity="0.22" stroke-dasharray="2 4"/>
    <circle cx="400" cy="400" r="330" stroke="#22D3EE" stroke-opacity="0.18" stroke-dasharray="2 4"/>
  </g>

  <!-- rotating groups holding tech nodes -->

  <!-- Ring 1: LANGUAGES (TypeScript, JavaScript, C, C++) -->
  <g transform="translate(400 400)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(0 -90)">
      <circle r="14" fill="#0B1224" stroke="#22D3EE" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">TS</text>
      <text y="-20" text-anchor="middle" class="mono micro">TypeScript</text>
    </g>
    <g transform="translate(64 64)">
      <circle r="14" fill="#0B1224" stroke="#22D3EE" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">JS</text>
      <text x="22" y="3" class="mono micro">JavaScript</text>
    </g>
    <g transform="translate(-64 64)">
      <circle r="14" fill="#0B1224" stroke="#A855F7" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">C</text>
      <text x="-22" y="3" class="mono micro" text-anchor="end">C</text>
    </g>
    <g transform="translate(0 90)">
      <circle r="14" fill="#0B1224" stroke="#A855F7" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">C++</text>
      <text y="26" text-anchor="middle" class="mono micro">C++</text>
    </g>
  </g>

  <!-- Ring 2: WEB STACK (React, Next.js, HTML) -->
  <g transform="translate(400 400)">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="50s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(0 -150)">
      <circle r="14" fill="#0B1224" stroke="#A855F7" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">REACT</text>
    </g>
    <g transform="translate(150 0)">
      <circle r="14" fill="#0B1224" stroke="#A855F7" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">NEXT</text>
      <text x="22" y="3" class="mono micro">Next.js</text>
    </g>
    <g transform="translate(-150 0)">
      <circle r="14" fill="#0B1224" stroke="#22D3EE" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">HTML</text>
      <text x="-22" y="3" text-anchor="end" class="mono micro">HTML5</text>
    </g>
  </g>

  <!-- Ring 3: BACKEND / RUNTIME (Node.js, MongoDB, PostgreSQL) -->
  <g transform="translate(400 400)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(0 -210)">
      <circle r="14" fill="#0B1224" stroke="#22D3EE" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">NODE</text>
    </g>
    <g transform="translate(180 110)">
      <circle r="14" fill="#0B1224" stroke="#22D3EE" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">MONGO</text>
    </g>
    <g transform="translate(-180 110)">
      <circle r="14" fill="#0B1224" stroke="#22D3EE" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">PG</text>
      <text x="-22" y="3" text-anchor="end" class="mono micro">PostgreSQL</text>
    </g>
  </g>

  <!-- Ring 4: DATA (planned) -->
  <g transform="translate(400 400)">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="70s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(0 -270)">
      <circle r="14" fill="#0B1224" stroke="#A855F7" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">SQL</text>
    </g>
    <g transform="translate(270 0)">
      <circle r="14" fill="#0B1224" stroke="#A855F7" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">JSON</text>
    </g>
  </g>

  <!-- Ring 5: TOOLS / PLATFORMS (Git, GitHub, Linux, Vercel, Cursor) -->
  <g transform="translate(400 400)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(0 -330)">
      <circle r="14" fill="#0B1224" stroke="#22D3EE" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">GIT</text>
      <text y="-20" text-anchor="middle" class="mono micro">Git</text>
    </g>
    <g transform="translate(330 0)">
      <circle r="14" fill="#0B1224" stroke="#22D3EE" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">GH</text>
      <text x="22" y="3" class="mono micro">GitHub</text>
    </g>
    <g transform="translate(0 330)">
      <circle r="14" fill="#0B1224" stroke="#A855F7" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">LINUX</text>
      <text y="26" text-anchor="middle" class="mono micro">Linux</text>
    </g>
    <g transform="translate(-330 0)">
      <circle r="14" fill="#0B1224" stroke="#A855F7" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">VERCEL</text>
      <text x="-22" y="3" text-anchor="end" class="mono micro">Vercel</text>
    </g>
    <g transform="translate(-233 -233)">
      <circle r="14" fill="#0B1224" stroke="#22D3EE" stroke-width="1.2"/>
      <text y="3" text-anchor="middle" class="mono tech" font-size="9">CRS</text>
      <text x="-22" y="3" text-anchor="end" class="mono micro">Cursor</text>
    </g>
  </g>

  <!-- core -->
  <g>
    <circle cx="400" cy="400" r="80" fill="url(#o-halo)" filter="url(#o-blur)"/>
    <circle cx="400" cy="400" r="46" fill="url(#o-core)"/>
    <circle cx="400" cy="400" r="46" fill="none" stroke="#22D3EE" stroke-opacity="0.6"/>
    <circle cx="400" cy="400" r="56" fill="none" stroke="#22D3EE" stroke-opacity="0.3" stroke-dasharray="2 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="400" y="396" text-anchor="middle" class="mono" font-size="11" fill="#020617" letter-spacing="2" font-weight="700">ENGINEERING</text>
    <text x="400" y="412" text-anchor="middle" class="mono" font-size="10" fill="#020617" letter-spacing="2" font-weight="700">CORE</text>
  </g>

  <!-- corner labels -->
  <g class="mono">
    <text class="micro" x="40" y="40">SCENE 04 / TECH UNIVERSE</text>
    <text class="micro" x="40" y="56" fill="#22D3EE">5 ORBITS ? 16 NODES</text>
    <text class="micro" x="760" y="40" text-anchor="end">VERIFIED FROM PUBLIC REPOS</text>
    <text class="micro" x="760" y="56" text-anchor="end" fill="#A855F7">REV 2026.09</text>
    <text class="micro" x="40" y="780">? rotate ? scroll ? zoom out   engineering orbits you</text>
    <text class="micro" x="760" y="780" text-anchor="end">? all systems verified nominal</text>
  </g>
</svg>
