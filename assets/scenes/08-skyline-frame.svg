<?xml version="1.0" encoding="UTF-8"?>
<!--
  08-skyline-frame.svg   Frame for the third-party 3D contribution skyline.
  Provides the "CONTRIBUTION SKYLINE / NEURAL CITY" heading and frame.
  The actual 3D graph is referenced separately via raw URL in the README.
  Size 1200x200 so it pairs with an image of equal width.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-label="Contribution skyline frame — Neural City heading" font-family="JetBrains Mono, ui-monospace, monospace">
  <title>QUAN.OS // Contribution Skyline Frame</title>
  <desc>Decorative frame introducing the 3D contribution skyline below.</desc>
  <defs>
    <linearGradient id="cf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#080B16"/>
    </linearGradient>
    <linearGradient id="cf-stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="0.8" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style><![CDATA[
    .mono{font-family:JetBrains Mono,Fira Code,IBM Plex Mono,ui-monospace,Menlo,monospace}
    .title{font-size:32px;fill:#F8FAFC;letter-spacing:8px;font-weight:700}
    .sub{font-size:11px;fill:#22D3EE;letter-spacing:6px}
    .micro{font-size:9px;fill:#64748B;letter-spacing:2px}
    @media (prefers-reduced-motion: reduce){
      animate,animateTransform{display:none}
    }
  ]]></style>
  <rect width="1200" height="200" fill="url(#cf-bg)"/>
  <g stroke="#1E293B" stroke-width="0.5">
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="20" x2="1200" y2="20"/>
  </g>
  <rect x="0" y="60" width="1200" height="2" fill="url(#cf-stripe)">
    <animate attributeName="x" values="-100;100;200" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="100" class="mono sub">SCENE 08 / CONTRIBUTION SKYLINE</text>
  <text x="60" y="138" class="mono title">NEURAL CITY</text>
  <text x="60" y="166" class="mono micro">3D contribution skyline · yoshi389111/github-profile-3d-contrib</text>
  <g class="mono">
    <text x="1140" y="100" text-anchor="end" class="micro" fill="#22D3EE">SECTOR 52 NODES</text>
    <text x="1140" y="118" text-anchor="end" class="micro" fill="#A855F7">ZONE 07 · NIGHT</text>
    <text x="1140" y="136" text-anchor="end" class="micro">SYNC · OK</text>
    <text x="1140" y="154" text-anchor="end" class="micro">QUAN-OS / ENGINE</text>
    <text x="1140" y="172" text-anchor="end" class="micro">v2.0.0</text>
  </g>
</svg>