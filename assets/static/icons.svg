<?xml version="1.0" encoding="UTF-8"?>
<!--
  icons.svg   sprite-like single SVG containing reusable &lt;symbol&gt; icons
  Referenced via &lt;use href=&quot;./assets/static/icons.svg#cpu&quot;/&gt; etc.
  All strokes use currentColor so callers can override via CSS color on the host.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 0 0" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <linearGradient id="ico-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

  <!-- CPU / microchip -->
  <symbol id="ico-cpu" viewBox="0 0 24 24">
    <rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <rect x="9" y="9" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.1"/>
    <g stroke="currentColor" stroke-width="1.1">
      <path d="M9 3v2M12 3v2M15 3v2"/>
      <path d="M9 19v2M12 19v2M15 19v2"/>
      <path d="M3 9h2M3 12h2M3 15h2"/>
      <path d="M19 9h2M19 12h2M19 15h2"/>
    </g>
  </symbol>

  <!-- Neural network -->
  <symbol id="ico-neural" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
      <circle cx="4" cy="6" r="1.5" fill="currentColor"/>
      <circle cx="4" cy="12" r="1.5" fill="currentColor"/>
      <circle cx="4" cy="18" r="1.5" fill="currentColor"/>
      <circle cx="12" cy="4" r="1.6" fill="currentColor"/>
      <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
      <circle cx="12" cy="20" r="1.6" fill="currentColor"/>
      <circle cx="20" cy="9" r="1.5" fill="currentColor"/>
      <circle cx="20" cy="15" r="1.5" fill="currentColor"/>
      <path d="M5.4 6 10.4 4M5.4 12 10.2 12M5.4 18 10.4 20M5.5 6.6 10.2 11.2M5.5 17.4 10.2 12.8M13.6 4 18.4 9M13.6 4 18.4 15M13.6 12 18.4 9M13.6 12 18.4 15M13.6 20 18.4 15"/>
    </g>
  </symbol>

  <!-- Database -->
  <symbol id="ico-db" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.3">
      <ellipse cx="12" cy="5.5" rx="7" ry="2.5"/>
      <path d="M5 5.5v6c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-6"/>
      <path d="M5 11.5v6c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-6"/>
    </g>
  </symbol>

  <!-- Cloud / uplink -->
  <symbol id="ico-cloud" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
      <path d="M6 16.5a4 4 0 0 1 .8-7.92A6 6 0 0 1 18 11a3.5 3.5 0 0 1-.6 6.95Z"/>
      <path d="M12 11v6M9.5 14l2.5-2.5L14.5 14"/>
    </g>
  </symbol>

  <!-- Code brackets -->
  <symbol id="ico-code" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 6 3 12l5 6"/>
      <path d="M16 6l5 6-5 6"/>
      <path d="M14 4l-4 16"/>
    </g>
  </symbol>

  <!-- Gear -->
  <symbol id="ico-gear" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.3">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>
    </g>
  </symbol>

  <!-- Spark -->
  <symbol id="ico-spark" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 2 13.8 9.2 21 11l-7.2 1.8L12 22l-1.8-9.2L3 11l7.2-1.8Z"/>
  </symbol>

  <!-- Rocket -->
  <symbol id="ico-rocket" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M14 4c4 0 6 2 6 6-3 1-5 3-6 6-3-1-5-3-6-6 3-1 5-3 6-6Z"/>
      <circle cx="14" cy="10" r="1.6"/>
      <path d="M8 14c-2 2-2 5-2 5s3 0 5-2"/>
      <path d="M16 14c2 2 2 5 2 5s-3 0-5-2"/>
    </g>
  </symbol>

  <!-- Pulse -->
  <symbol id="ico-pulse" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12h4l2-5 3 10 3-7 2 2h6"/>
    </g>
  </symbol>

  <!-- Terminal prompt -->
  <symbol id="ico-term" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="4.5" width="19" height="15" rx="2"/>
      <path d="m6 10 3 2-3 2"/>
      <path d="M12 14h6"/>
    </g>
  </symbol>

  <!-- Github mark (simplified, decoupled from any logo) -->
  <symbol id="ico-github" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.15-1.1-1.46-1.1-1.46-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/>
  </symbol>

  <!-- Folder -->
  <symbol id="ico-folder" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
    </g>
  </symbol>

  <!-- Eye -->
  <symbol id="ico-eye" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.3">
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
      <circle cx="12" cy="12" r="3"/>
    </g>
  </symbol>

  <!-- Star -->
  <symbol id="ico-star" viewBox="0 0 24 24">
    <path fill="currentColor" d="m12 2 3 6.9 7.5.6-5.7 4.9 1.8 7.3L12 17.8 5.4 21.7l1.8-7.3L1.5 9.5 9 8.9Z"/>
  </symbol>

  <!-- Fork -->
  <symbol id="ico-fork" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <circle cx="6" cy="5" r="2"/>
      <circle cx="18" cy="5" r="2"/>
      <circle cx="12" cy="19" r="2"/>
      <path d="M6 7v3a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7M12 12v5"/>
    </g>
  </symbol>

  <!-- Clock -->
  <symbol id="ico-clock" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7v5l3 2"/>
    </g>
  </symbol>

  <!-- Battery -->
  <symbol id="ico-batt" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.4">
      <rect x="2" y="8" width="17" height="8" rx="1.5"/>
      <rect x="20" y="10.5" width="2" height="3" rx="0.5" fill="currentColor"/>
    </g>
  </symbol>

  <!-- Signal -->
  <symbol id="ico-signal" viewBox="0 0 24 24">
    <g fill="currentColor">
      <rect x="3" y="16" width="3" height="5"/>
      <rect x="9" y="12" width="3" height="9"/>
      <rect x="15" y="7" width="3" height="14"/>
    </g>
  </symbol>

  <!-- Lock -->
  <symbol id="ico-lock" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <rect x="4" y="10" width="16" height="11" rx="2"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
    </g>
  </symbol>

  <!-- Globe -->
  <symbol id="ico-globe" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.3">
      <circle cx="12" cy="12" r="9"/>
      <ellipse cx="12" cy="12" rx="4" ry="9"/>
      <path d="M3 12h18"/>
    </g>
  </symbol>
  </defs>
</svg>
