<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="580" height="260" role="img" aria-label="QMusic — project card" fill="none">
<title>QMusic — project card</title>
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1526"/><stop offset="1" stop-color="#0C1222"/></linearGradient>

</defs>
<style><![CDATA[
  .sans{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif}
  .mono{font-family:'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, monospace}
  .fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
  .blink{animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    animate,animateTransform,animateMotion{display:none}
  }

  .spin{animation:spin 5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .eq{transform-box:fill-box;transform-origin:bottom;animation:eq 1s ease-in-out infinite alternate}
  @keyframes eq{from{transform:scaleY(.12)}to{transform:scaleY(1)}}

  .arrow{animation:arr 2.4s ease-in-out infinite}
  @keyframes arr{0%,100%{opacity:.6}50%{opacity:1}}
]]></style>

<rect x="0.5" y="0.5" width="579" height="259" rx="18" fill="url(#cardbg)" stroke="#1C2540"/><rect x="0.5" y="0.5" width="579" height="259" rx="18" stroke="url(#accent)" stroke-width="1.4" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round" opacity=".85"><animate attributeName="stroke-dashoffset" values="1000;0" dur="9s" begin="-4.5s" repeatCount="indefinite"/></rect><path d="M18 1H562" stroke="#FFFFFF" stroke-opacity=".06"/>
