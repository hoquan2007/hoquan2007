<text x="28" y="86" class="sans" font-size="26" font-weight="700" fill="#E6EDF7">QMusic</text>
<text x="28" y="118" class="sans" font-size="15" fill="#8D9AB3">Web nghe nhạc cá nhân — trình phát,</text>
<text x="28" y="140" class="sans" font-size="15" fill="#8D9AB3">playlist và giao diện tối giản.</text>
