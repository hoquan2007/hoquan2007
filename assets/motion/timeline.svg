<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Journey timeline" fill="none">
<title>Journey timeline</title>
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1526"/><stop offset="1" stop-color="#0C1222"/></linearGradient>

</defs>
<style><![CDATA[
  .sans{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif}
  .mono{font-family:'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, monospace}
  .fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
  .blink{animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    animate,animateTransform,animateMotion{display:none}
  }

  .line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:ln 2.2s .2s cubic-bezier(.6,0,.2,1) forwards}
  @keyframes ln{to{stroke-dashoffset:0}}
]]></style>

<rect x="0.5" y="0.5" width="1199" height="249" rx="18" fill="url(#cardbg)" stroke="#1C2540"/><rect x="0.5" y="0.5" width="1199" height="249" rx="18" stroke="url(#accent)" stroke-width="1.4" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round" opacity=".85"><animate attributeName="stroke-dashoffset" values="1000;0" dur="14s" begin="0s" repeatCount="indefinite"/></rect><path d="M18 1H1182" stroke="#FFFFFF" stroke-opacity=".06"/>
<text x="36" y="40" class="mono" font-size="12" letter-spacing="2.5" fill="#22D3EE">JOURNEY // 2025 → NOW</text>
<path d="M100 118H1100" stroke="#1C2540" stroke-width="2"/>
<path d="M100 118H1100" stroke="url(#accent)" stroke-width="2" pathLength="1000" class="line"/>
<circle r="4" fill="#FFFFFF" opacity=".9"><animateMotion dur="7s" begin="2.4s" repeatCount="indefinite" path="M100 118H1100"/>
  <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.1;.9;1" dur="7s" begin="2.4s" repeatCount="indefinite"/></circle>
<g class="fu" style="animation-delay:0.35s"><text x="100.0" y="88" text-anchor="middle" class="mono" font-size="13" fill="#22D3EE">07 · 2025</text><circle cx="100.0" cy="118" r="8" fill="#0C1222" stroke="#22D3EE" stroke-width="2"/><circle cx="100.0" cy="118" r="3" fill="#22D3EE"/><text x="100.0" y="158" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF7">Gia nhập GitHub</text><text x="100.0" y="180" text-anchor="middle" class="sans" font-size="13.5" fill="#8D9AB3">Bắt đầu hành trình</text></g><g class="fu" style="animation-delay:0.67s"><text x="300.0" y="88" text-anchor="middle" class="mono" font-size="13" fill="#A78BFA">03 · 2026</text><circle cx="300.0" cy="118" r="8" fill="#0C1222" stroke="#A78BFA" stroke-width="2"/><circle cx="300.0" cy="118" r="3" fill="#A78BFA"/><text x="300.0" y="158" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF7">Nền tảng C / C++</text><text x="300.0" y="180" text-anchor="middle" class="sans" font-size="13.5" fill="#8D9AB3">ProjectChess · Code_C</text></g><g class="fu" style="animation-delay:0.99s"><text x="500.0" y="88" text-anchor="middle" class="mono" font-size="13" fill="#22D3EE">05 · 2026</text><circle cx="500.0" cy="118" r="8" fill="#0C1222" stroke="#22D3EE" stroke-width="2"/><circle cx="500.0" cy="118" r="3" fill="#22D3EE"/><text x="500.0" y="158" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF7">GPU-Server-Manager</text><text x="500.0" y="180" text-anchor="middle" class="sans" font-size="13.5" fill="#8D9AB3">Bài tập lớn lập trình C</text></g><g class="fu" style="animation-delay:1.31s"><text x="700.0" y="88" text-anchor="middle" class="mono" font-size="13" fill="#A78BFA">07 · 2026</text><circle cx="700.0" cy="118" r="8" fill="#0C1222" stroke="#A78BFA" stroke-width="2"/><circle cx="700.0" cy="118" r="3" fill="#A78BFA"/><text x="700.0" y="158" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF7">Web &amp; Next.js</text><text x="700.0" y="180" text-anchor="middle" class="sans" font-size="13.5" fill="#8D9AB3">Shadow-Collapse · NextGPU</text></g><g class="fu" style="animation-delay:1.63s"><text x="900.0" y="88" text-anchor="middle" class="mono" font-size="13" fill="#22D3EE">09 · 2026</text><circle cx="900.0" cy="118" r="8" fill="#0C1222" stroke="#22D3EE" stroke-width="2"/><circle cx="900.0" cy="118" r="3" fill="#22D3EE"/><text x="900.0" y="158" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF7">AI &amp; Vision</text><text x="900.0" y="180" text-anchor="middle" class="sans" font-size="13.5" fill="#8D9AB3">face-attendance · ResearchAI</text></g><g class="fu" style="animation-delay:1.95s"><text x="1100.0" y="88" text-anchor="middle" class="mono" font-size="13" fill="#34D399">11 · 2026</text><circle cx="1100.0" cy="118" r="10" stroke="#34D399" stroke-width="1.5"><animate attributeName="r" values="8;20" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2s" repeatCount="indefinite"/></circle><circle cx="1100.0" cy="118" r="8" fill="#0C1222" stroke="#34D399" stroke-width="2"/><circle cx="1100.0" cy="118" r="3" fill="#34D399"/><text x="1100.0" y="158" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#E6EDF7">41+ repositories</text><text x="1100.0" y="180" text-anchor="middle" class="sans" font-size="13.5" fill="#8D9AB3">Chess online · Web-xem-phim</text></g>

</svg>
