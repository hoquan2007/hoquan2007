    <circle cx="230" cy="380" r="170" fill="#22D3EE" opacity=".16">
      <animateTransform attributeName="transform" type="translate" values="0 0;90 -40;0 0" dur="24s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
    <circle cx="1120" cy="400" r="130" fill="#60A5FA" opacity=".22">
      <animateTransform attributeName="transform" type="translate" values="0 0;-40 -60;0 0" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
  </g>
  <rect width="1200" height="420" fill="url(#dots)" mask="url(#dotmask)" opacity=".7"/>
  <circle cx="140" cy="60" r="1.2" fill="#C7D2FE" class="tw" style="animation-delay:0.00s"/><circle cx="420" cy="48" r="1.2" fill="#C7D2FE" class="tw" style="animation-delay:0.45s"/><circle cx="690" cy="92" r="1.2" fill="#C7D2FE" class="tw" style="animation-delay:0.90s"/><circle cx="760" cy="330" r="1.2" fill="#C7D2FE" class="tw" style="animation-delay:1.35s"/><circle cx="560" cy="380" r="1.2" fill="#C7D2FE" class="tw" style="animation-delay:1.80s"/><circle cx="1130" cy="70" r="1.2" fill="#C7D2FE" class="tw" style="animation-delay:2.25s"/><circle cx="1150" cy="300" r="1.2" fill="#C7D2FE" class="tw" style="animation-delay:2.70s"/><circle cx="330" cy="395" r="1.2" fill="#C7D2FE" class="tw" style="animation-delay:3.15s"/><circle cx="820" cy="40" r="1.2" fill="#C7D2FE" class="tw" style="animation-delay:3.60s"/><circle cx="40" cy="260" r="1.2" fill="#C7D2FE" class="tw" style="animation-delay:4.05s"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="419" rx="24" fill="url(#cardbg)" stroke="#1C2540"/><rect x="0.5" y="0.5" width="1199" height="419" rx="24" stroke="url(#accent)" stroke-width="1.4" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round" opacity=".85"><animate attributeName="stroke-dashoffset" values="1000;0" dur="12s" begin="0s" repeatCount="indefinite"/></rect><path d="M24 1H1176" stroke="#FFFFFF" stroke-opacity=".06"/>

<g class="fu" style="animation-delay:.1s"><text x="72" y="112" class="mono" font-size="15" fill="#22D3EE">&lt;/&gt;  xin chào, mình là</text></g>
<g class="fu" style="animation-delay:.25s"><text x="68" y="188" class="sans" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Hồ Ngọc Quân</text></g>
<g class="fu" style="animation-delay:.45s">
  <text x="72" y="246" class="sans" font-size="25" font-weight="600" fill="#22D3EE">▸</text>
  <g class="role r1"><text x="100" y="246" class="sans" font-size="25" font-weight="500" fill="#E6EDF7">Software Engineering Student</text></g><g class="role r2"><text x="100" y="246" class="sans" font-size="25" font-weight="500" fill="#E6EDF7">Full-stack Web Developer</text></g><g class="role r3"><text x="100" y="246" class="sans" font-size="25" font-weight="500" fill="#E6EDF7">AI &amp; Computer Vision Explorer</text></g><g class="role r4"><text x="100" y="246" class="sans" font-size="25" font-weight="500" fill="#E6EDF7">Systems · C/C++ Enthusiast</text></g>
</g>
<g class="fu" style="animation-delay:.6s">
  <text x="72" y="288" class="sans" font-size="16.5" fill="#8D9AB3">Xây sản phẩm Web, AI và hệ thống — từ C/C++ cấp thấp tới TypeScript full-stack.</text>
</g>
<g class="fu" style="animation-delay:.75s"><rect x="72" y="326" width="206" height="34" rx="17" fill="#0E1526" stroke="#1C2540"/><circle cx="92" cy="343" r="8" fill="#34D399" opacity=".25" class="pulse"/><circle cx="92" cy="343" r="4" fill="#34D399"/><text x="108" y="348" class="sans" font-size="14" fill="#E6EDF7">Open to collaborate</text><rect x="290" y="326" width="178" height="34" rx="17" fill="#0E1526" stroke="#1C2540"/><path d="M310 352c-4-5-7-8-7-12a7 7 0 0 1 14 0c0 4-3 7-7 12z" stroke="#22D3EE" stroke-width="1.6"/><circle cx="310" cy="340" r="2.2" fill="#22D3EE"/><text x="326" y="348" class="sans" font-size="14" fill="#E6EDF7">Việt Nam · UTC+7</text><rect x="480" y="326" width="236" height="34" rx="17" fill="#0E1526" stroke="#1C2540"/><rect x="493" y="336" width="14" height="14" rx="3" stroke="#A78BFA" stroke-width="1.6"/><path d="M497 343h6" stroke="#A78BFA" stroke-width="1.6"/><text x="516" y="348" class="sans" font-size="14" fill="#E6EDF7">41+ repos · 18 live demos</text></g>

<g class="fu" style="animation-delay:.4s">
  <circle cx="968" cy="212" r="150" stroke="#1C2540" stroke-dasharray="2 7">
    <animateTransform attributeName="transform" type="rotate" from="0 968 212" to="360 968 212" dur="90s" repeatCount="indefinite"/></circle>
  <circle cx="968" cy="212" r="150" stroke="url(#accent)" stroke-width="1.6" pathLength="100" stroke-dasharray="10 90" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 968 212" to="360 968 212" dur="14s" repeatCount="indefinite"/></circle>
  <circle cx="968" cy="212" r="104" stroke="#1C2540"/>
  <g><circle cx="968" cy="108" r="3.5" fill="#F472B6"/>
    <animateTransform attributeName="transform" type="rotate" from="360 968 212" to="0 968 212" dur="22s" repeatCount="indefinite"/></g>
  <circle cx="968" cy="212" r="92" fill="url(#core)" class="pulse" style="animation-duration:6s"/>
  <g class="float">
    <circle cx="968" cy="212" r="58" fill="#0C1222" stroke="url(#accent)" stroke-width="1.6"/>
    <text x="968" y="226" text-anchor="middle" class="sans" font-size="40" font-weight="800" letter-spacing="1" fill="url(#accent)">HQ</text>
  </g>
  <g><rect x="-52.0" y="-14" width="104" height="28" rx="14" fill="#0E1526" stroke="#1C2540"/><text y="4.5" text-anchor="middle" class="mono" font-size="12" fill="#22D3EE">TypeScript</text><animateMotion dur="48s" begin="0s" repeatCount="indefinite"><mpath href="#orbitA"/></animateMotion></g><g><rect x="-41.0" y="-14" width="82" height="28" rx="14" fill="#0E1526" stroke="#1C2540"/><text y="4.5" text-anchor="middle" class="mono" font-size="12" fill="#A78BFA">C / C++</text><animateMotion dur="48s" begin="-12s" repeatCount="indefinite"><mpath href="#orbitA"/></animateMotion></g><g><rect x="-41.0" y="-14" width="82" height="28" rx="14" fill="#0E1526" stroke="#1C2540"/><text y="4.5" text-anchor="middle" class="mono" font-size="12" fill="#22D3EE">Next.js</text><animateMotion dur="48s" begin="-24s" repeatCount="indefinite"><mpath href="#orbitA"/></animateMotion></g><g><rect x="-38.0" y="-14" width="76" height="28" rx="14" fill="#0E1526" stroke="#1C2540"/><text y="4.5" text-anchor="middle" class="mono" font-size="12" fill="#A78BFA">AI · CV</text><animateMotion dur="48s" begin="-36s" repeatCount="indefinite"><mpath href="#orbitA"/></animateMotion></g>
</g>
<text x="1164" y="396" text-anchor="end" class="mono" font-size="12" fill="#5B6782">github.com/hoquan2007</text>

