<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Hồ Ngọc Quân — Software Engineering Student" fill="none">
<title>Hồ Ngọc Quân — Software Engineering Student</title>
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1526"/><stop offset="1" stop-color="#0C1222"/></linearGradient>

<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#2A3554"/></pattern>
<radialGradient id="fade" cx="60%" cy="45%" r="65%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="dotmask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
<clipPath id="clip"><rect x="1" y="1" width="1198" height="418" rx="24"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070A13"/><stop offset="1" stop-color="#0D1428"/></linearGradient>
<linearGradient id="name" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="620" y2="0">
  <stop offset="0" stop-color="#E6EDF7"/><stop offset=".38" stop-color="#E6EDF7"/>
  <stop offset=".5" stop-color="#A5F3FC"/><stop offset=".6" stop-color="#C4B5FD"/>
  <stop offset=".72" stop-color="#E6EDF7"/><stop offset="1" stop-color="#E6EDF7"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-640 0;640 0;640 0" keyTimes="0;.45;1" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#A78BFA" stop-opacity=".55"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<path id="orbitA" d="M818,212 a150,150 0 1,1 300,0 a150,150 0 1,1 -300,0"/>

</defs>
<style><![CDATA[
  .sans{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif}
  .mono{font-family:'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, monospace}
  .fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
  .blink{animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    animate,animateTransform,animateMotion{display:none}
  }

  .role{opacity:0;animation:role 12s infinite both}
  .r2{animation-delay:3s}.r3{animation-delay:6s}.r4{animation-delay:9s}
  @keyframes role{0%{opacity:0;transform:translateY(14px)}3.5%{opacity:1;transform:none}
    22%{opacity:1;transform:none}25.5%{opacity:0;transform:translateY(-14px)}100%{opacity:0}}
  .float{animation:float 7s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .tw{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
]]></style>

<g clip-path="url(#clip)">
  <rect width="1200" height="420" fill="url(#bg)"/>
  <g filter="url(#blur)">
