<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 150"
     width="100%"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="Cyber footer wave">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#020617"/>
      <stop offset="50%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- background bar -->
  <rect width="1200" height="150" fill="url(#bg)"/>

  <!-- glow layer -->
  <g filter="url(#glow)" opacity="0.6">
    <path d="M0,90 Q150,30 300,90 T600,90 T900,90 T1200,90 L1200,150 L0,150 Z"
          fill="#22d3ee" fill-opacity="0.6">
      <animate attributeName="d"
        dur="6s" repeatCount="indefinite"
        values="
          M0,90 Q150,30 300,90 T600,90 T900,90 T1200,90 L1200,150 L0,150 Z;
          M0,90 Q150,150 300,90 T600,90 T900,90 T1200,90 L1200,150 L0,150 Z;
          M0,90 Q150,30 300,90 T600,90 T900,90 T1200,90 L1200,150 L0,150 Z"/>
    </path>
  </g>

  <!-- crisp line -->
  <path d="M0,90 Q150,30 300,90 T600,90 T900,90 T1200,90"
        fill="none"
        stroke="url(#lineGrad)"
        stroke-width="2">
    <animate attributeName="d"
      dur="6s" repeatCount="indefinite"
      values="
        M0,90 Q150,30 300,90 T600,90 T900,90 T1200,90;
        M0,90 Q150,150 300,90 T600,90 T900,90 T1200,90;
        M0,90 Q150,30 300,90 T600,90 T900,90 T1200,90"/>
  </path>

  <!-- second offset wave -->
  <path d="M0,110 Q150,60 300,110 T600,110 T900,110 T1200,110"
        fill="none"
        stroke="#a855f7"
        stroke-opacity="0.55"
        stroke-width="1.5">
    <animate attributeName="d"
      dur="9s" repeatCount="indefinite"
      values="
        M0,110 Q150,60 300,110 T600,110 T900,110 T1200,110;
        M0,110 Q150,160 300,110 T600,110 T900,110 T1200,110;
        M0,110 Q150,60 300,110 T600,110 T900,110 T1200,110"/>
  </path>

  <!-- thank-you text -->
  <text x="600" y="60"
        text-anchor="middle"
        font-family="JetBrains Mono, Fira Code, Consolas, monospace"
        font-size="22"
        font-weight="700"
        letter-spacing="6"
        fill="#ffffff"
        filter="url(#glow)">
    THANK  YOU  FOR  VISITING
  </text>

  <text x="600" y="135"
        text-anchor="middle"
        font-family="JetBrains Mono, Fira Code, Consolas, monospace"
        font-size="11"
        letter-spacing="4"
        fill="#67e8f9">
    &gt; system.shutdown()  "  stay curious, stay shipping  &lt;
  </text>
</svg>
